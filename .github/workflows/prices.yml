name: Update prices
on:
  schedule:
    - cron: "30 22 * * 1-5"   # 06:30 Taipei, after the US close
    - cron: "30 7 * * 1-5"    # 15:30 Taipei, after the Taiwan/Japan/HK close
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python scripts/fetch_prices.py
      - run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update prices"
          git push
